name: Manter Supabase ativo

# Chama a função ping() duas vezes por semana para o projeto gratuito não ser pausado
# por falta de uso. Precisa de dois "secrets" no GitHub (veja o LEIA-ME.md).
on:
  schedule:
    - cron: '17 11 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar ping() no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CHAVE_PUBLICA: ${{ secrets.SUPABASE_CHAVE_PUBLICA }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_CHAVE_PUBLICA" \
            -H "Content-Type: application/json" \
            -d '{}'
